<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gran Siniestra</title>

<link rel="stylesheet" href="./assets/css/global.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
    
<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    min-height:100vh;
    font-family: Georgia, serif;
    color:var(--gs-text);
    overflow-x:hidden;
}

/* FONDO */
.background{
    position:fixed;
    inset:0;
    background-image:url("https://2img.net/i.imgur.com/GBzrOwk.jpg");
    background-size:cover;
    background-position:center;
    z-index:-2;
}
.background::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(2px);
}

/* CONTENIDO */
.container{
    width:min(1400px, 92%);
    margin:auto;
    padding:40px 0 80px;
}

/* HEADER */
.header{
    text-align:center;
    margin-bottom:40px;
}
.logo{
    width:130px;
    height:130px;
    object-fit:contain;
    margin-bottom:18px;
}
.title{
    font-size:1rem, 5vw, 5.2rem;
    font-weight: normal;
    letter-spacing:1.0rem;
    line-height:1;
    margin-bottom:30px;
}

.subtitle{
    font-family: "Yanone Kaffeesatz", sans-serif;
    font-size:.75rem;
    font-weight:300;
    letter-spacing:.85em;
    text-transform:uppercase;
    opacity:.85;
    margin-bottom:24px;
}
.discord-btn{
    display:inline-block;
    padding:14px 34px;
    text-decoration:none;
    color:var(--gs-text);
    border:1px solid var(--gs-accent);
    border-radius:10px;
    background:rgba(106,20,18,.10);
    transition:.25s;
    font-family: "Yanone Kaffeesatz", sans-serif;
    letter-spacing:.40em;
}
.discord-btn:hover{
    transform:translateY(-2px);
    background:rgba(106,20,18,.10);
}

/* SEPARADOR */
.divider{
    width:100%;
    height:1px;
    background:linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    margin:50px 0;
}

/* GRID */
.portal-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,380px));
    justify-content:center;
    gap:30px;
    margin-top:50px;
}
  
/* TARJETAS */
.portal-card{
    text-decoration:none;
    color:var(--gs-text);
    background:var(--gs-card-bg);
    border:1px solid var(--gs-border);
    border-radius:16px;
    overflow:hidden;
    transition:.25s ease;
    box-shadow:0 10px 25px var(--gs-shadow);
}
.portal-card:hover{
    transform:translateY(-6px);
    border-color:rgba(184,155,94,.5);
}
.portal-card:hover .card-image img{
    transform:scale(1.05);
}
.card-image{
    position:relative;
    aspect-ratio:16/8;
    overflow:hidden;
}

/* ========================= */
/* TARJETAS EN CONSTRUCCIÓN  */
/* ========================= */

.portal-card.construccion .card-image::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:2;
}

.portal-card.construccion .card-image::after{
    content:"EN CONSTRUCCIÓN";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    color:white;
    font-family:var(--font-ui);
    font-size:1.5rem;
    letter-spacing:.25em;
    text-transform:uppercase;
    text-align:center;
    text-shadow:0 0 12px black;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.35s ease;
}
.card-title{
    text-align:center;
    padding:14px;
    font-size:.65rem;
    font-family: "Yanone Kaffeesatz", sans-serif;
    letter-spacing:.85em;
}

/* MÓVIL */
@media (max-width:600px){
    .container{
        width:95%;
    }
    .logo{
        width:100px;
        height:100px;
    }
    .card-title{
        font-size:1rem;
    }
}

/* ========================================
   FOOTER LEGAL
======================================== */

.footer-legal{
    margin:90px auto 25px;
    text-align:center;
    font-size:.78rem;
    color:var(--gs-textgris);
    line-height:1.8;
    opacity:.75;
}

.footer-legal a{
    color:var(--gs-textgris);
    text-decoration:none;
    transition:.2s;
}

.footer-legal a:hover{
    color:var(--gs-text);
}

.footer-legal img{
    width:15px;
    height:15px;
    margin-left:4px;
    vertical-align:-2px;
    opacity:.85;
}

</style>
</head>
<body>
  
<div class="background"></div>
  <div class="container">
  <header class="header">
    <img
        class="logo"
        src="https://2img.net/i.imgur.com/43eMCwf.png"
        alt="Gran Siniestra">
    <h1 class="title gs-title">Gran Siniestra</h1>
    <p class="subtitle gs-subtitle">
        PANEL DE HERRAMIENTAS
    </p>
    <a class="discord-btn gs-button"
       href="https://discord.gg/3RP4Jxv9Rh"
       target="_blank">
       ÚNETE AL SERVIDOR
    </a>
</header>
  
<div class="divider"></div>
<section class="portal-grid">
  
    <a class="portal-card gs-card" href="./mapa/">
        <div class="card-image">
            <img src="https://i.imgur.com/TNoK0PN.jpeg" alt="Mapa">
        </div>
        <div class="card-title">
            MAPA INTERACTIVO
        </div>
    </a>
  
    <a
    class="portal-card construccion"
    href="javascript:void(0)"
    onclick="return false;"
    title="Próximamente">
        
        <div class="card-image">
            <img src="https://i.imgur.com/EcNxKGu.png" alt="Cronología">
        </div>
        <div class="card-title">
            CRONOLOGÍA
        </div>
    </a>
  
</section>
</div>

<footer class="footer-legal">

    <a href="https://example.com">Gran Siniestra</a>
    © 2020 by
    <a href="https://example.com">Nuria Calzada</a>
    is licensed under
    <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank">
        CC BY-NC-ND 4.0
    </a>

    <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="CC">
    <img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="BY">
    <img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="NC">
    <img src="https://mirrors.creativecommons.org/presskit/icons/nd.svg" alt="ND">

</footer>

</body>
</html>
