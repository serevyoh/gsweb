<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Administrador de Eventos</title>

<link rel="stylesheet"
      href="admin.css">

</head>

<body>

<div class="admin-container">
<div class="admin-layout">
<div class="admin-formulario">

    <h1>
        Administrador de Cronología
    </h1>

    <div class="campo">

        <label>Título</label>

        <input
            type="text"
            id="titulo">

    </div>

    <div class="fila">

        <div class="campo">

            <label>Era</label>

            <select id="era">

                <option value="antigua">
                    Antigua
                </option>

                <option value="clasica">
                    Clásica
                </option>

                <option value="actual">
                    Actual
                </option>

            </select>

        </div>

        <div class="campo">

            <label>Año inicio</label>

            <input
                type="number"
                id="inicio">

        </div>

        <div class="campo">

            <label>Año fin</label>

            <input
                type="number"
                id="fin">

        </div>

    </div>

    <div class="campo">

        <label>Tipo</label>

        <input
            type="text"
            id="tipo">

    </div>

    <div class="campo">

        <label>Color</label>

        <input
            type="color"
            id="color"
            value="#7a1f1f">

    </div>

    <div class="campo">

        <label>Imagen</label>

        <input
            type="text"
            id="imagen">

    </div>

    <div class="campo">

        <label>Descripción</label>

        <textarea
            id="descripcion"></textarea>

    </div>

    <div class="campo">

    <label>Modo de relato</label>

    <select id="modoRelato">

        <option value="html">
            Archivo HTML
        </option>

        <option value="integrado">
            Texto integrado
        </option>

    </select>

</div>

<div
    class="campo"
    id="bloqueHtml">

    <label>Archivo HTML</label>

    <input
        type="text"
        id="textoArchivo">

</div>

<div
    class="campo oculto"
    id="bloqueIntegrado">

    <label>Texto integrado</label>

    <div class="editor-toolbar">

        <button
            type="button"
            onclick="formato('bold')">
            B
        </button>

        <button
            type="button"
            onclick="formato('italic')">
            I
        </button>

        <button
    type="button"
    onclick="tituloH1()">
    H1
</button>

<button
    type="button"
    onclick="tituloH2()">
    H2
</button>

<button
    type="button"
    onclick="tituloH3()">
    H3
</button>

<button
    type="button"
    onclick="centrarTexto()">
    Centrar
</button>

<button
    type="button"
    onclick="insertarCita()">
    Cita
</button>

<button
    type="button"
    onclick="insertarLista()">
    Lista
</button>

<button
    type="button"
    onclick="insertarTituloRelato()">
    Título
</button>

<button
    type="button"
    onclick="insertarFraseFinal()">
    Frase Final
</button>

        <button
            type="button"
            onclick="insertarSeparador()">
            ─
        </button>

    </div>

    <div
        id="editorRelato"
        contenteditable="true">
    </div>

</div>

<h2>Lugares</h2>

<div id="lugares"></div>

<button
    type="button"
    id="addLugar">

    + Añadir lugar

</button>

<h2>Consecuencias</h2>

<div id="consecuencias"></div>

<button
    type="button"
    id="addConsecuencia">

    + Añadir consecuencia

</button>

<h2>Consecuencias destacadas</h2>

<div id="consecuenciasDestacadas"></div>

<button
    type="button"
    id="addConsecuenciaDestacada">

    + Añadir consecuencia destacada

</button>

<h2>Reinos</h2>

<div id="reinos"></div>

<button
    type="button"
    id="addReino">

    + Añadir reino

</button>

<h2>Personajes</h2>

<div id="personajes"></div>

<button
    type="button"
    id="addPersonaje">

    + Añadir personaje

</button>

    <button
        id="generar">

        Generar JSON

    </button>

    <button
        id="descargar">

        Descargar JSON

    </button>

<h2>Importar JSON</h2>

<textarea
    id="importador"
    placeholder="Pega aquí un evento JSON">
</textarea>

<button
    id="importar">

    Importar Evento

</button>

    <h2>Resultado</h2>

    <textarea
        id="resultado"
        readonly></textarea>

</div>
</div>

<div class="admin-preview">

    <h2>Vista previa</h2>

    <div class="preview-card">

        <div
            class="preview-imagen"
            id="previewImagen">
        </div>

        <div
            class="preview-anio"
            id="previewAnio">
            1144
        </div>

        <h3
            id="previewTitulo">
            Nuevo Evento
        </h3>

        <p
            id="previewDescripcion">
            Descripción...
        </p>

    </div>

</div>

</div>
<script src="admin.js"></script>

</body>
</html>
